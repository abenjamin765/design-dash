schema_version: "1.1"
method:
  id: design-dash
  name: Design Dash
  outcome: A build-ready, evidence-backed product plan with a stakeholder pitch site.
  principles:
    - Evidence and assumptions are labeled separately.
    - Rigor is derived from risk, reversibility, and reach.
    - User mental models and system models are reconciled explicitly.
    - Accessibility, ethics, equity, and privacy are design inputs.
    - Outputs remain portable across tools.
    - The Dash Model (plain files) is the single source of truth; living-plan MDX and every other human-facing view are generated projections of it.

session_modes:
  interactive:
    description: Hard WAIT FOR USER at every numbered checkpoint.
  solo:
    description: Wait only at phase boundaries and hard gates. Auto-confirm intra-phase checkpoints into auto-confirms.md.
    ceiling: standard
    high_stakes_halt: P0

tiers:
  express:
    use_when: Low risk, easily reversible, and narrow reach.
    required_gates: [edge_ethics_equity]
  standard:
    use_when: Moderate risk or a meaningful multi-role workflow.
    required_gates: [evidence, reconciliation, selection, edge_ethics_equity, learning]
  high_stakes:
    use_when: Irreversible or broad-impact work, safety concerns, or regulated data.
    required_gates: [evidence, reconciliation, selection, edge_ethics_equity, learning, privacy_compliance]

evidence_labels: [observed, reported, inferred, assumed, unknown]

phases:
  - id: P0
    name: Preconditions
    intent: Establish whether the dash can be run responsibly.
    activities: [classify tier, set session mode, confirm research access, identify responsible disciplines]
    outputs: [dash-config.yaml, sign-off roster]
    exit: Tier, session mode, and participation constraints are explicit. Solo + High-stakes halts here.
  - id: P1
    name: Opportunity and evidence
    intent: Frame a falsifiable problem and separate evidence from belief.
    activities: [assemble evidence, write problem statement, log assumptions, define metric hypotheses]
    outputs: [assumptions.md, metrics.md, living-plan/phases/p1.mdx]
    gate: evidence
    exit: Unsupported claims are labeled and assigned a validation path.
  - id: P2
    name: Intake and object modeling
    intent: Capture domain context, dual mental models, and the object model that organizes the experience.
    activities: [interview stakeholders, capture observed and assumed language, forage nouns, run ORCA, author object guides, prioritize attributes with quantitative methods, export object graph]
    outputs: [scope.md, object model, NOM, CTA matrix, object guides, prioritization report, object graph, living-plan/phases/p2.mdx]
    exit: The team can distinguish what users think from what the system currently encodes, and in-scope objects are modeled.
  - id: P3
    name: Framing lock
    intent: Define the provisional design surface and protect it from silent scope growth.
    activities: [state goals, state non-goals, link scope to assumptions, write design-spec sections]
    outputs: [design-spec.md, living-plan/phases/p3.mdx]
    exit: Scope, non-goals, and reopening conditions are recorded.
  - id: P4
    name: Flow and reconciliation
    intent: Derive journeys and page architecture; reconcile system model with user mental model.
    activities: [map scenarios, map edge paths, define page architecture, resolve divergences]
    outputs: [flow.md, page list, living-plan/phases/p4.mdx]
    gate: reconciliation
    exit: System and user-model divergences are resolved or tracked.
  - id: P5
    name: Divergence and selection
    intent: Compare meaningfully different product concepts before converging.
    activities: [create two or three concepts, score user and business value, apply QFD or Pugh matrix when weighted criteria exist, record tradeoffs]
    outputs: [concept set, concept scorecard, decision rationale, living-plan/phases/p5.mdx]
    gate: selection
    exit: A concept is selected with documented tradeoffs.
  - id: P6
    name: Wireframe and ethics
    intent: Make the selected concept testable and pressure-test its consequences.
    activities: [map objects to UI representations, wireframe, annotate interactions, cover edge states, audit accessibility, review ethics and equity]
    outputs: [ui-mapping.md, wireframe.html, edge-state matrix, ethics-review.md, living-plan/phases/p6.mdx]
    gate: edge_ethics_equity
    exit: Critical states and inclusive-use requirements are buildable.
  - id: P7
    name: Optional build
    intent: Optionally produce a coded prototype when a design-system base exists; otherwise record stub mode.
    activities: [attempt coded prototype, or write p7-build-note.md]
    outputs: [optional prototype page, or p7-build-note.md, living-plan/phases/p7.mdx]
    exit: Build path or honest stub is recorded. Never invent a proprietary design-system tree.
  - id: P8
    name: Validate and learn
    intent: Package decisions into a stakeholder pitch and a plan for learning.
    activities: [write research-plan, assemble pitch site, thin summary index, verify handoff package completeness, close learning gate]
    outputs: [pitch/index.html, research-plan.md, workshop-summary.md, summary.html, living-plan/phases/p8.mdx]
    gate: learning
    exit: A new team can build and test the plan without reconstructing the dash.

capability_fallbacks:
  no_web_access: Ask for pasted sources and record evidence limitations.
  no_file_access: Maintain a clearly headed transcript artifact for manual export.
  no_html_preview: Produce annotated Markdown wireframes and preserve the same state coverage.
  no_image_generation: Use diagrams, boxes, and sourced references; imagery is never gate-critical.
  no_multi_agent_support: Run specialist critiques sequentially and record discipline plus real-or-simulated status.
  no_node_runtime: Skip living-plan viewer and CLI; author workshop markdown directly from templates. Method gates still apply.
  no_survey_access: Substitute heuristic Kano classification (evidence-labeled, minimum two independent raters) for surveyed coefficients; disclose the substitution in the prioritization report.

references:
  sources_registry: method/sources.md
  evidence_note: >
    Phase recommendations are grounded in the sources registry. When a practice
    cites an external framework, the registry maps it to its phase and origin.
