# Dash Configuration
# One file per Design Dash.
# Governs tier, session mode, mandatory gates, and default thresholds.
# Tier is PROVISIONAL until P6 ethics Section C confirms. Promotion is always allowed.
# Lowering the tier requires zero Section C flags, a non-author reviewer's confirmation,
# and a tier-override-log entry — see design-dash/SKILL.md.

# --- Dash identity ---
dash-name: ""                       # Human-readable name (e.g. "Onboarding Redesign")
dash-id: ""                         # Unique slug (e.g. "onboarding-redesign-2026-06")
owner: ""                           # Lead designer
start-date: ""                      # YYYY-MM-DD
artifact_root: "dashes"             # Directory under repo root that holds {slug}/
session-mode: "interactive"         # interactive | solo
# halted-at: ""                     # Set to phase (e.g. "P0") if a solo High-stakes halt occurred;
#                                   # write nothing else when this is set — see design-dash/SKILL.md

# Optional: path to a product/prototype workspace if this dash may produce a coded prototype at P7.
# Leave empty for plan-only dashes (default OSS path). Unresolvable → P7 stub mode + p7-build-note.md.
prototype_workspace: ""

# --- Tier classification ---
# Tier is RULE-DERIVED, not chosen. The classifier runs at P0. Designer may escalate, never lower.
# High-stakes requires a reviewer who is not the dash author to confirm.
tier: ""                            # express | standard | high-stakes
computed-tier-rationale: ""         # The trigger that set the tier (e.g. "regulated PII surface → High-stakes")
tier-confirmed-by: ""               # Non-author reviewer name (required for High-stakes)
tier-confirmation-date: ""          # YYYY-MM-DD
# tier-provisional: true            # Set false after P6 Section C confirms (or lowers) the tier

# Tier-escalation triggers (any one forces the minimum tier shown):
#   T1 new disclosure of regulated personal data / PII  →  high-stakes (+ Privacy gate)
#   T2 payment / financial / health / assessment-scoring surface  →  high-stakes
#   T3 reach ≥ 10,000 end users OR multi-tenant / enterprise-wide rollout  →  high-stakes
#   T4 irreversible / not flag-guarded / not easily rolled back  →  high-stakes
#   T5 affects > 1 user role OR reach 500–9,999 users  →  standard
#   T6 reach < 500, single role, reversible, flag-guarded, no PII  →  express (floor)

# --- Active phases ---
phases-active:
  - P0   # Preconditions & tier classification
  # - P1   # Opportunity & Evidence (required: standard, high-stakes)
  # - P2   # Intake & Object Modeling
  # - P3   # Framing lock
  # - P4   # Flow & Reconciliation (required: standard, high-stakes)
  # - P5   # Divergence & Selection (required: standard, high-stakes — when ≥2 concepts contend)
  # - P6   # Wireframe & Ethics (required: all tiers — ethics floor always runs)
  # - P7   # Optional Build (stub when no prototype workspace)
  # - P8   # Validate & Learn (required: standard, high-stakes)

# --- Mandatory gates ---
# Auto-computed from tier; list here for visibility. See apps/dash-living-plan/contract/dash-contract.mjs
gates-required:
  - P6   # Ethics/equity floor — never waived

# Express skips (tracked as evidence debt, not deleted):
# gates-deferred: [P1, P4, P5, P8]   # Uncomment for Express tier; add to assumptions.md

# --- Required artifacts ---
artifacts-required:
  - assumptions.md
  - glossary.md
  - ethics-equity-checklist.md

# Standard additionally requires:
# - metrics.md
# - edge-state-matrix.md
# - sign-off-ledger.md
# - pitch/index.html
# - research-plan.md (or Learning Gate debt)

# --- Cross-functional sign-off ---
cross-functional-sign-off:
  required-disciplines: []
  simulation-allowed: true        # Express: all may simulate. Standard/High-stakes: see ledger.

# --- Default thresholds — calibrate after ~10 dashes ---
thresholds:
  reach-high-stakes-users: 10000
  reach-standard-users-min: 500
  reach-standard-users-max: 9999
  all-simulated-cap-quality2: "C"
  team-all-simulated-rate-cap: 0.40
  test-not-run-cap-quality3: "C"
  concepts-not-distinct-cap-quality7: "B"
  min-participants-per-role: 5
  learning-close-sla-standard: 15
  learning-close-sla-high-stakes: 30
  spot-audit-per-cycle: 2

# --- Tier override log ---
tier-override-log: []
# Example:
# - date: YYYY-MM-DD
#   from: standard
#   to: high-stakes
#   reason: "PII surface discovered at P3"
#   confirmed-by: [reviewer name]
